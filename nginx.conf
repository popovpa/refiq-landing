server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /robots.txt/ {
        return 301 /robots.txt;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "no-cache";
        try_files /sitemap.xml =404;
    }

    location = /docs {
        add_header Cache-Control "no-cache";
        try_files /docs/index.html =404;
    }

    location = /howto {
        add_header Cache-Control "no-cache";
        try_files /howto/index.html =404;
    }

    location = /docs/ {
        return 301 /docs;
    }

    location = /howto/ {
        return 301 /howto;
    }

    location = /docs/index.html {
        return 301 /docs;
    }

    location = /howto/index.html {
        return 301 /howto;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
